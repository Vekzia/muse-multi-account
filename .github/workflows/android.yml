name: Android build and checks

on:
  push:
    branches: ['main', 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build, test and lint
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MuseLauncher-APKs-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*
          if-no-files-found: warn
          retention-days: 14

  device-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK for device tests
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew --no-daemon --console=plain connectedDebugAndroidTest
            adb pull /sdcard/Android/data/com.seekstars.muselauncher/files/smoke app/build/smoke-screenshots
      - name: Upload device reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-device-smoke-${{ github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/smoke-screenshots/
          if-no-files-found: warn
          retention-days: 14
